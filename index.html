<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta property="og:title" content="Gratitude | A tool to help you improve your long-term well-being." />
  <meta property="og:image"
    content="https://static.gratefulness.me/gratitude-app-content/metadata/og-default.jpg" />
  <meta property="og:description"
    content="Write journal entries for your gratitude journal, construct self-affirmations, receive daily quotes, and build a vision board that consists of images and goals." />
  <title>Opening Gratitude…</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #F89C9C;
      --text-color: #2D3748;
      --text-secondary: #718096;
      --bg-gradient: linear-gradient(135deg, #FFF5F5 0%, #ecfdf5 100%);
      --card-bg: rgba(255, 255, 255, 0.8);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 3rem 2rem;
      border-radius: 24px;
      box-shadow: var(--shadow);
      text-align: center;
      max-width: 90%;
      width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeIn 0.6s ease-out;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 0.5rem;
      object-fit: cover;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-color);
    }

    .message {
      font-size: 1rem;
      color: var(--text-secondary);
      min-height: 1.5rem;
    }

    /* Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(248, 156, 156, 0.3);
      border-radius: 50%;
      border-top-color: var(--primary-color);
      animation: spin 1s ease-in-out infinite;
    }

    /* Manual Link Button */
    .btn {
      display: inline-block;
      background-color: var(--primary-color);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 0.5rem;
      box-shadow: 0 4px 6px -1px rgba(248, 156, 156, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 8px -1px rgba(248, 156, 156, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-color);
      box-shadow: none;
      border: 1px solid rgba(45, 55, 72, 0.2);
    }

    .btn-secondary:hover {
      box-shadow: none;
    }

    .subtle-link {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    #manual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="https://gratitude-app-content.s3.us-east-1.amazonaws.com/blog/icon_app.png" alt="Gratitude Logo"
      class="logo">
    <h1 id="heading">Opening Gratitude</h1>
    <div id="loading-spinner" class="spinner"></div>
    <div id="status" class="message">Initializing...</div>

    <div id="manual" style="display:none;">
      <div id="manual-link-container" style="display:flex;flex-direction:column;align-items:center;gap:0.5rem;"></div>
    </div>
  </div>
  <script>
    // ─── CONFIG ─────────────────────────────────────────────────────────
    const API_REDIRECT =
      'https://avhedfdhma.execute-api.us-east-1.amazonaws.com/prod/redirectToLongURL';
    const ANDROID_PACKAGE = "com.northstar.gratitude";
    const IOS_APP_ID = "1372575227";
    const FALLBACK_WEB = "https://www.gratefulness.me/";
    const BASE_PATH = '/gratitude-dynamic-link-handler/';
    // Where a shared link lands on the web, by the app screen it points to.
    const WEB_PAGES = {
      VisionBoard: "https://www.gratefulness.me/visionboard/",
      Affirmation: "https://www.gratefulness.me/affirmations/",
      AffirmationSlides: "https://www.gratefulness.me/affirmations/",
    };
    // ─────────────────────────────────────────────────────────────────────
    function extractUtmParams(url) {
      try {
        const u = new URL(url);
        const p = u.searchParams;
        const utm_source = p.get("utm_source");
        const utm_medium = p.get("utm_medium");
        const utm_campaign = p.get("utm_campaign");
        const out = {};
        if (utm_source) out.utm_source = utm_source;
        if (utm_medium) out.utm_medium = utm_medium;
        if (utm_campaign) out.utm_campaign = utm_campaign;
        return out;
      } catch {
        return {};
      }
    }
    function screenOf(url) {
      try {
        return new URL(url).searchParams.get("screen");
      } catch {
        return null;
      }
    }
    // The web page for this link, keeping its UTM tags so analytics still
    // credits the share.
    function webUrlFor(finalUrl) {
      const page = new URL(WEB_PAGES[screenOf(finalUrl)] || FALLBACK_WEB);
      const utm = extractUtmParams(finalUrl);
      Object.keys(utm).forEach((key) => page.searchParams.set(key, utm[key]));
      return page.toString();
    }
    function buildPlayStoreUrlWithReferrer(packageName, utmParams) {
      const base = `https://play.google.com/store/apps/details?id=${packageName}`;
      const pairs = [];
      if (utmParams.utm_source) pairs.push(`utm_source=${utmParams.utm_source}`);
      if (utmParams.utm_medium) pairs.push(`utm_medium=${utmParams.utm_medium}`);
      if (utmParams.utm_campaign) pairs.push(`utm_campaign=${utmParams.utm_campaign}`);
      if (pairs.length === 0) return base;
      const referrerPayload = pairs.join("&");
      const encoded = encodeURIComponent(referrerPayload);
      return `${base}&referrer=${encoded}`;
    }
    function buildAndroidIntentUrl(finalUrl, playFallbackUrl) {
      // intent://<host+path+query>#Intent;scheme=https;package=<pkg>;S.browser_fallback_url=<encoded>;end
      const stripped = (finalUrl || "").replace(/^https?:\/\//i, "");
      const encodedFallback = encodeURIComponent(playFallbackUrl);
      return `intent://${stripped}#Intent;scheme=https;package=${ANDROID_PACKAGE};S.browser_fallback_url=${encodedFallback};end`;
    }
    function platform() {
      const ua = navigator.userAgent;
      if (/Android/i.test(ua)) return "android";
      // iPadOS Safari reports itself as a Mac; touch support gives it away.
      if (/iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1)) return "ios";
      return "desktop";
    }
    async function init() {
      const status = document.getElementById('status');
      const spinner = document.getElementById('loading-spinner');
      const rawPath = window.location.pathname;
      let code = rawPath;
      if (rawPath.startsWith(BASE_PATH)) {
        code = rawPath.slice(BASE_PATH.length);
      }
      code = code.replace(/^\/+|\/+$/g, '');
      if (!code) {
        status.textContent = 'Invalid link.';
        spinner.style.display = 'none';
        return;
      }
      status.textContent = 'Resolving link...';
      let finalUrl = null;
      try {
        // The Pages Function inlines the destination, so the resolve round trip
        // only happens if this page was served without it.
        finalUrl = (window.__GRATITUDE_LINK__ || {}).longUrl || null;
        if (!finalUrl) {
          const resp = await fetch(API_REDIRECT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
          });
          if (!resp.ok) {
            const err = await resp.json().catch(() => ({}));
            throw new Error(err.message || `HTTP ${resp.status}`);
          }
          const data = await resp.json();
          finalUrl = data.longUrl;
        }
        const device = platform();
        if (device === "android") {
          status.textContent = 'Opening app...';
          const utmParams = extractUtmParams(finalUrl);
          const playUrl = buildPlayStoreUrlWithReferrer(ANDROID_PACKAGE, utmParams);
          // ✅ Use browser_fallback_url so Android handles the fallback in one flow
          window.location = buildAndroidIntentUrl(finalUrl, playUrl);
          // Optional: reveal a manual button quickly in case intent is blocked
          setTimeout(() => showManual(finalUrl), 1200);
        } else if (device === "ios") {
          // With the app installed, iOS opens it before this page loads (the
          // association file is served by the Pages Function). Reaching this
          // page usually means no app, or an in-app browser that skips
          // universal links. A scripted redirect can't open the app either,
          // so let the person choose with a tap.
          showManual(finalUrl);
        } else {
          // Desktop: the web version of what was shared.
          window.location = webUrlFor(finalUrl);
        }
      } catch (err) {
        console.error('Redirect error:', err);
        status.textContent = 'Something went wrong';
        spinner.style.display = 'none';
        showManual(finalUrl);
      }
    }
    function addLink(container, href, text, className) {
      const a = document.createElement('a');
      a.href = href;
      a.textContent = text;
      a.className = className;
      container.appendChild(a);
    }
    function showManual(finalUrl) {
      const manual = document.getElementById('manual');
      const container = document.getElementById('manual-link-container');
      const spinner = document.getElementById('loading-spinner');
      const status = document.getElementById('status');
      if (spinner) spinner.style.display = 'none';
      container.textContent = '';
      const device = platform();
      if (device === "android") {
        status.textContent = "If the app doesn't open automatically:";
        const utmParams = extractUtmParams(finalUrl || "");
        addLink(container, buildPlayStoreUrlWithReferrer(ANDROID_PACKAGE, utmParams),
          'Get it on Google Play', 'btn');
      } else if (device === "ios") {
        document.getElementById('heading').textContent = 'Gratitude';
        status.textContent = 'Gratitude journal, affirmations and vision boards in one app.';
        addLink(container, `https://apps.apple.com/app/id${IOS_APP_ID}`,
          'Download on the App Store', 'btn');
        if (finalUrl) {
          // A tap on a link to another domain does trigger universal links.
          addLink(container, finalUrl, 'Already have it? Open in the app',
            'btn btn-secondary');
          if (screenOf(finalUrl) === "VisionBoard") {
            addLink(container, webUrlFor(finalUrl),
              'Or make a vision board on the web', 'subtle-link');
          }
        }
      } else {
        addLink(container, finalUrl ? webUrlFor(finalUrl) : FALLBACK_WEB,
          'Visit our website', 'btn');
      }
      manual.style.display = 'flex';
    }
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>

</html>
